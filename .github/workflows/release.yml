name: Prepare release draft

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run release:check -- "$RELEASE_TAG"
      - run: npm run check
      - name: Extract the release notes
        run: npm run release:notes -- "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
      - name: Create a draft with the distribution files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "Local Tags $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/local-tags/main.js \
            dist/local-tags/manifest.json \
            dist/local-tags/styles.css \
            dist/local-tags/LICENSE \
            dist/local-tags/THIRD-PARTY-NOTICES.txt
